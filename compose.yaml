services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studyflow
      POSTGRES_PASSWORD: studyflow_dev_password
      POSTGRES_DB: studyflow
    ports:
      - "5433:5432"
    volumes:
      - studyflow_pg:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # local SMTP sink; not a real delivery service
      - "8025:8025" # Mailpit inbox UI/API
volumes:
  studyflow_pg:
